[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "errorpilot-local"
version = "0.3.0"
description = "Local Python diagnostics and approved repair automation"
requires-python = ">=3.11"
dependencies = ["typer>=0.12", "rich>=13", "packaging>=24"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
errorpilot = "errorpilot.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
